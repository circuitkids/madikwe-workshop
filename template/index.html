<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/core/fonts/fonts.css">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Madikwe's paper-cut story film. Deterministic: everything is a function of t and content.json.
const W = 1280, H = 720;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ss = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const back = (t, s = 1.8) => { t = clamp(t) - 1; return 1 + t * t * ((s + 1) * t + s); };
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };

const PALETTES = [
  { name: 'day', sky: ['#7ec8e3', '#d8f0f7'], orb: '#ffd75e', orbX: 1000, orbY: 130, orbR: 62,
    hills: ['#63a850', '#4c8f3f', '#35702c'], cloud: 'rgba(255,255,255,0.92)', stars: false, trunk: '#6b4a2f', canopy: '#3f7d33' },
  { name: 'dusk', sky: ['#f4a65a', '#e2703a'], orb: '#ffdf80', orbX: 260, orbY: 300, orbR: 74,
    hills: ['#a05a3a', '#83452c', '#5f3220'], cloud: 'rgba(255,217,176,0.85)', stars: false, trunk: '#4e3120', canopy: '#7d4a26' },
  { name: 'night', sky: ['#22335c', '#0e1830'], orb: '#f5f0dc', orbX: 980, orbY: 150, orbR: 54,
    hills: ['#31456e', '#243354', '#182444'], cloud: 'rgba(80,100,150,0.5)', stars: true, trunk: '#1c1530', canopy: '#22355c' },
];
const INK = '#3a2a1a', BORDER = '#f7f2e4';

let C = null; // content
function wrap(text, font, maxW) {
  ctx.font = font;
  const words = text.split(/\s+/), lines = []; let cur = '';
  for (const w of words) {
    const try_ = cur ? cur + ' ' + w : w;
    if (ctx.measureText(try_).width > maxW && cur) { lines.push(cur); cur = w; } else cur = try_;
  }
  if (cur) lines.push(cur);
  return lines;
}
function paperPath(pts, fill, borderW = 10, inkW = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = BORDER; ctx.lineWidth = borderW; ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = inkW; ctx.stroke();
}
function wobblyHill(y, amp, seed, x0 = -40, x1 = W + 40, step = 46) {
  const pts = [[x0, H + 40]];
  for (let x = x0; x <= x1; x += step) pts.push([x, y + vnoise(x * 0.008 + seed) * amp - amp / 2]);
  pts.push([x1, H + 40]);
  return pts;
}
function tree(x, y, s, pal, sw) {
  // trunk
  paperPath([[x - 8 * s, y], [x - 3 * s, y - 78 * s], [x + 3 * s, y - 78 * s], [x + 8 * s, y]], pal.trunk, 8, 2.5);
  // flat canopy, three blobs
  const sway = Math.sin(sw) * 3 * s;
  const blob = (cx, cy, r) => {
    ctx.beginPath();
    const rr = [];
    for (let a = 0; a <= 16; a++) { const t = a / 16 * TAU; rr.push([cx + Math.cos(t) * (r + vnoise(a * 0.9 + x) * r * 0.14), cy + Math.sin(t) * r * 0.55]); }
    ctx.moveTo(rr[0][0], rr[0][1]); for (const p of rr) ctx.lineTo(p[0], p[1]); ctx.closePath();
    ctx.fillStyle = pal.canopy; ctx.fill();
    ctx.lineJoin = 'round'; ctx.strokeStyle = BORDER; ctx.lineWidth = 9; ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  };
  blob(x - 26 * s + sway, y - 92 * s, 34 * s); blob(x + 24 * s + sway, y - 96 * s, 36 * s); blob(x + sway, y - 112 * s, 40 * s);
}
function grass(x, y, s, col, ph) {
  for (let i = 0; i < 5; i++) {
    const gx = x + i * 9 * s, bend = Math.sin(ph + i) * 4 * s;
    ctx.beginPath(); ctx.moveTo(gx, y);
    ctx.quadraticCurveTo(gx + bend, y - 14 * s, gx + bend * 1.6, y - 22 * s);
    ctx.strokeStyle = col; ctx.lineWidth = 3 * s; ctx.lineCap = 'round'; ctx.stroke();
  }
}
function cloud(x, y, s, col) {
  ctx.fillStyle = col;
  for (const [dx, dy, r] of [[0, 0, 30], [26, 4, 24], [-26, 6, 22], [8, -12, 22]]) {
    ctx.beginPath(); ctx.ellipse(x + dx * s, y + dy * s, r * s, r * 0.62 * s, 0, 0, TAU); ctx.fill();
  }
}
function paw(x, y, s, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y, 10 * s, 8 * s, 0, 0, TAU); ctx.fill();
  for (const [dx, dy] of [[-12, -12], [-4, -16], [4, -16], [12, -12]]) {
    ctx.beginPath(); ctx.ellipse(x + dx * s, y + dy * s, 4.4 * s, 5.4 * s, 0, 0, TAU); ctx.fill();
  }
}
function popLayer(t0, idx) { return back(seg(T - t0 - idx * 0.12, 0, 0.5), 1.6); }

let T = 0;
function drawScene(sc, i) {
  const pal = PALETTES[sc.palette % PALETTES.length];
  const lt = T - sc.start; // local time
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, pal.sky[1]); g.addColorStop(1, pal.sky[0]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // stars
  if (pal.stars) {
    const rng = mulberry(7);
    for (let k = 0; k < 60; k++) {
      const x = rng() * W, y = rng() * H * 0.55, tw = 0.5 + 0.5 * Math.sin(T * 2 + k * 1.7);
      ctx.fillStyle = `rgba(245,240,220,${0.25 + 0.55 * tw})`;
      ctx.beginPath(); ctx.arc(x, y, 1.1 + rng() * 1.4, 0, TAU); ctx.fill();
    }
  }
  // sun / moon with pop-in
  const orbK = back(seg(lt, 0.05, 0.55), 1.5);
  if (orbK > 0) {
    ctx.save(); ctx.translate(pal.orbX, pal.orbY); ctx.scale(Math.max(0.01, orbK), Math.max(0.01, orbK));
    ctx.beginPath(); ctx.arc(0, 0, pal.orbR, 0, TAU);
    ctx.fillStyle = pal.orb; ctx.fill();
    ctx.lineWidth = 10; ctx.strokeStyle = BORDER; ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    if (pal.name === 'night') { ctx.fillStyle = 'rgba(180,180,160,0.5)'; ctx.beginPath(); ctx.arc(-14, -8, 9, 0, TAU); ctx.arc(12, 10, 6, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  // clouds drifting
  const rng = mulberry(i * 31 + 5);
  for (let k = 0; k < 3; k++) {
    const cx = ((rng() * W + T * (6 + k * 4)) % (W + 260)) - 130, cy = 90 + rng() * 140;
    cloud(cx, cy, 0.8 + rng() * 0.6, pal.cloud);
  }
  // hills, popping back to front
  const hills = [[430, 60, i * 3 + 1], [500, 78, i * 7 + 2], [580, 92, i * 11 + 3]];
  hills.forEach(([y, amp, seed], j) => {
    const k = popLayer(sc.start, j);
    if (k <= 0) return;
    ctx.save(); ctx.translate(0, y); ctx.scale(1, Math.max(0.01, k)); ctx.translate(0, -y);
    paperPath(wobblyHill(y, amp, seed * 10), pal.hills[j], 12, 3);
    ctx.restore();
  });
  // tree + grass on the front hill
  const tk = back(seg(lt, 0.45, 0.95), 1.7);
  if (tk > 0) {
    ctx.save(); ctx.translate(0, 560); ctx.scale(Math.max(0.01, tk), Math.max(0.01, tk)); ctx.translate(0, -560);
    tree(210 + (i % 2) * 850, 560, 1.05, pal, T * 1.1 + i);
    ctx.restore();
  }
  if (tk > 0.4) { grass(430, 640, 1, INK, T * 1.4); grass(760, 660, 1.2, INK, T * 1.4 + 2); grass(1020, 630, 0.9, INK, T * 1.4 + 4); }
  // subtitle band
  const subK = seg(lt, 0.35, 0.6);
  if (subK > 0 && sc.text) {
    const bandH = 108, y0 = H - bandH * ss(subK);
    ctx.fillStyle = 'rgba(38,26,16,0.92)'; ctx.fillRect(0, y0, W, H - y0);
    const lines = wrap(sc.text, '500 34px Fredoka, sans-serif', W - 220);
    ctx.fillStyle = '#f7f2e4'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '500 34px Fredoka, sans-serif';
    const lh = 42, cy = y0 + (H - y0) / 2 - (lines.length - 1) * lh / 2;
    lines.forEach((ln, j) => ctx.fillText(ln, W / 2, cy + j * lh));
  }
}
function drawTitle() {
  ctx.fillStyle = '#1d3f8f'; ctx.fillRect(0, 0, W, H);   // CK blue paper
  const rng = mulberry(3);
  for (let k = 0; k < 26; k++) { ctx.fillStyle = `rgba(255,255,255,${0.03 + rng() * 0.04})`; ctx.beginPath(); ctx.arc(rng() * W, rng() * H, 20 + rng() * 60, 0, TAU); ctx.fill(); }
  const k = back(seg(T, 0.15, 0.7), 1.5);
  ctx.save(); ctx.translate(W / 2, H / 2 - 30); ctx.scale(Math.max(0.01, k), Math.max(0.01, k));
  const cw = 880, ch = 300;
  paperPath([[-cw / 2, -ch / 2], [cw / 2, -ch / 2], [cw / 2, ch / 2], [-cw / 2, ch / 2]], '#f7f2e4', 14, 4);
  const lines = wrap(C.title, '400 76px "Lilita One", sans-serif', cw - 120);
  ctx.fillStyle = '#1d3f8f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '400 76px "Lilita One", sans-serif';
  const lh = 88, y0 = -(lines.length - 1) * lh / 2;
  lines.forEach((ln, j) => ctx.fillText(ln, 0, y0 + j * lh));
  ctx.restore();
  const pk = seg(T, 0.8, 1.6);
  for (let j = 0; j < 4; j++) { const kk = seg(pk, j * 0.22, j * 0.22 + 0.18); if (kk > 0) { ctx.globalAlpha = kk; paw(420 + j * 130, 560 + (j % 2) * 26, 1.6, '#f7f2e4'); ctx.globalAlpha = 1; } }
}
function drawEnd() {
  const e = C.end, lt = T - e.start;
  ctx.fillStyle = '#16244a'; ctx.fillRect(0, 0, W, H);
  const rng = mulberry(9);
  for (let k = 0; k < 60; k++) { const tw = 0.5 + 0.5 * Math.sin(T * 2 + k); ctx.fillStyle = `rgba(245,240,220,${0.2 + 0.5 * tw})`; ctx.beginPath(); ctx.arc(rng() * W, rng() * H * 0.7, 1 + rng() * 1.5, 0, TAU); ctx.fill(); }
  const k = back(seg(lt, 0.1, 0.6), 1.5);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(Math.max(0.01, k), Math.max(0.01, k));
  paperPath([[-440, -170], [440, -170], [440, 170], [-440, 170]], '#f7f2e4', 14, 4);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1d3f8f'; ctx.font = '400 54px "Lilita One", sans-serif';
  ctx.fillText(C.title, 0, -80);
  ctx.fillStyle = '#3a2a1a'; ctx.font = 'italic 400 40px "IM Fell English", serif';
  ctx.fillText('Made at the BOMA by Madikwe', 0, 10);
  paw(0, 95, 1.7, '#1d3f8f');
  ctx.restore();
}
window.render = t => {
  T = t;
  ctx.clearRect(0, 0, W, H);
  if (t < C.titleCard.end) { drawTitle(); return; }
  if (t >= C.end.start) { drawEnd(); return; }
  for (let i = 0; i < C.scenes.length; i++) {
    const sc = C.scenes[i];
    if (t >= sc.start && t < sc.start + sc.dur) { drawScene(sc, i); return; }
  }
  drawEnd();
};
window.TEXTS = t => {
  const out = [];
  if (t < C.titleCard.end) out.push({ id: 'title', text: C.title, x0: 200, y0: 210, x1: 1080, y1: 510 });
  if (t >= C.end.start) { out.push({ id: 'motto', text: 'Made at the BOMA by Madikwe', x0: 260, y0: 330, x1: 1020, y1: 400 }); return out; }
  for (const sc of C.scenes) if (t >= sc.start + 0.35 && t < sc.start + sc.dur) { out.push({ id: 'sub', text: sc.text, x0: 110, y0: 612, x1: 1170, y1: 720 }); break; }
  return out;
};
const q = new URLSearchParams(location.search);
fetch(q.get('content') || 'content.json').then(r => r.json()).then(c => {
  C = c;
  window.DUR = c.dur;
  window.EV = c.ev;
  window.READY = true;
});
</script>
</body>
</html>
